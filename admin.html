<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SweetBite — Admin Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#0b1117;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

.wrap{
  max-width:1400px;
  margin:auto;
  padding:25px;
}

.card{
  background:#121c25;
  border:1px solid #263543;
  border-radius:16px;
  padding:20px;
  margin:14px 0;
}

h1{
  margin:0;
  color:#ffc400;
}

h2{
  margin-top:0;
}

.muted{
  color:#9aa9b5;
}

.hidden{
  display:none!important;
}

.row{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  align-items:center;
}

input,
button,
select{
  padding:11px;
  border-radius:9px;
  border:1px solid #3a4a58;
  background:#0b1117;
  color:#fff;
}

input{
  min-width:220px;
}

button{
  background:#ffc400;
  color:#111;
  font-weight:800;
  cursor:pointer;
  border:0;
}

button:hover{
  opacity:.9;
}

.btn-secondary{
  background:#263543;
  color:#fff;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:12px;
}

.stat{
  background:#17232e;
  border-radius:14px;
  padding:18px;
}

.money{
  font-size:24px;
  font-weight:900;
  margin-top:5px;
}

.search{
  width:100%;
  max-width:450px;
}

.table-wrap{
  overflow:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:1100px;
}

th,
td{
  padding:12px;
  border-bottom:1px solid #263543;
  text-align:left;
  font-size:13px;
  vertical-align:top;
}

th{
  color:#ffc400;
  background:#17232e;
}

.order-items{
  margin-top:7px;
  color:#d7e0e6;
}

.item{
  padding:3px 0;
}

.badge{
  display:inline-block;
  padding:5px 8px;
  border-radius:7px;
  background:#263543;
  font-size:12px;
  font-weight:bold;
}

.paid{
  color:#67e08a;
}

.unpaid{
  color:#ff8b8b;
}

.notice{
  background:#2b2410;
  border:1px solid #735e17;
  color:#ffe99a;
  padding:12px;
  border-radius:10px;
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.75);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:999;
}

.modal-box{
  width:100%;
  max-width:700px;
  max-height:90vh;
  overflow:auto;
  background:#121c25;
  border:1px solid #354957;
  border-radius:16px;
  padding:25px;
}

.close{
  float:right;
  background:#263543;
  color:#fff;
}

.detail-row{
  border-bottom:1px solid #263543;
  padding:10px 0;
}

.detail-label{
  color:#9aa9b5;
  font-size:12px;
}

.detail-value{
  margin-top:3px;
}

footer{
  margin-top:30px;
  padding:20px 0;
  color:#758592;
  text-align:center;
}

@media(max-width:700px){

  .wrap{
    padding:15px;
  }

  input{
    min-width:100%;
  }

  .search{
    max-width:none;
  }

  h1{
    font-size:25px;
  }
}
</style>
</head>

<body>

<div class="wrap">

  <!-- HEADER -->

  <div class="row" style="justify-content:space-between">

    <div>
      <h1>SWEETBITE</h1>
      <div class="muted">
        Healthy snacks and pastries — Admin Dashboard
      </div>
    </div>

    <button id="logoutBtn"
            class="hidden"
            onclick="logout()">
      Logout
    </button>

  </div>


  <!-- LOGIN -->

  <section id="login" class="card">

    <h2>Admin Login</h2>

    <p class="muted">
      Sign in with your SweetBite administrator account.
    </p>

    <div class="row">

      <input
        id="email"
        type="email"
        placeholder="Admin email"
      >

      <input
        id="password"
        type="password"
        placeholder="Password"
      >

      <button onclick="login()">
        Sign in
      </button>

    </div>

    <p id="err"></p>

  </section>


  <!-- DASHBOARD -->

  <section id="dash" class="hidden">

    <div class="row" style="justify-content:space-between">

      <div>
        <span class="muted">Logged in as:</span>
        <strong id="who"></strong>
      </div>

      <div class="row">

        <input
          id="search"
          class="search"
          type="search"
          placeholder="Search order, customer or phone..."
          oninput="renderOrders()"
        >

        <select id="statusFilter"
                onchange="renderOrders()">

          <option value="all">
            All statuses
          </option>

          <option value="new">
            New
          </option>

          <option value="confirmed">
            Confirmed
          </option>

          <option value="preparing">
            Preparing
          </option>

          <option value="out_for_delivery">
            Out for delivery
          </option>

          <option value="delivered">
            Delivered
          </option>

          <option value="cancelled">
            Cancelled
          </option>

        </select>

        <button onclick="loadOrders()">
          Refresh
        </button>

      </div>

    </div>


    <!-- STATISTICS -->

    <div id="stats"
         class="grid"
         style="margin-top:15px">
    </div>


    <!-- ORDERS -->

    <div class="card">

      <div class="row"
           style="justify-content:space-between">

        <h2>All Orders</h2>

        <span id="orderCount"
              class="muted">
        </span>

      </div>

      <div class="table-wrap">

        <table>

          <thead>

            <tr>

              <th>Order</th>

              <th>Customer</th>

              <th>Items</th>

              <th>Subtotal</th>

              <th>Delivery</th>

              <th>Total</th>

              <th>Payment</th>

              <th>Status</th>

              <th>Created</th>

              <th>Action</th>

            </tr>

          </thead>

          <tbody id="orders">

          </tbody>

        </table>

      </div>

    </div>

  </section>


  <footer>
    SweetBite • Healthy snacks and pastries
  </footer>

</div>


<!-- ORDER DETAILS MODAL -->

<div id="modal"
     class="modal hidden"
     onclick="closeModal(event)">

  <div class="modal-box">

    <button class="close"
            onclick="hideModal()">
      Close
    </button>

    <h2>Order Details</h2>

    <div id="modalContent"></div>

  </div>

</div>


<script>

const SUPABASE_URL =
  'https://vilzncccdmegrwvrmadb.supabase.co';

const SUPABASE_KEY =
  'sb_publishable_NZKF2zYb9l9LbrhulGD-8Q_FmqfD25V';

const sb =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let allOrders = [];


const naira = n =>
  `₦${Number(n || 0).toLocaleString()}`;


function escapeHtml(value){

  return String(value ?? '')
    .replaceAll('&','&amp;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;')
    .replaceAll('"','&quot;')
    .replaceAll("'","&#039;");

}


function showDash(user){

  document
    .getElementById('login')
    .classList.add('hidden');

  document
    .getElementById('dash')
    .classList.remove('hidden');

  document
    .getElementById('logoutBtn')
    .classList.remove('hidden');

  document
    .getElementById('who')
    .textContent =
      user?.email || '';

  loadOrders();

}


async function login(){

  const err =
    document.getElementById('err');

  err.textContent = '';

  const emailValue =
    document.getElementById('email')
      .value
      .trim();

  const passwordValue =
    document.getElementById('password')
      .value;

  if(!emailValue || !passwordValue){

    err.textContent =
      'Please enter your email and password.';

    return;

  }


  const {data,error} =
    await sb.auth.signInWithPassword({

      email:emailValue,

      password:passwordValue

    });


  if(error){

    err.textContent =
      error.message;

    return;

  }


  showDash(data.user);

}


async function logout(){

  await sb.auth.signOut();

  location.reload();

}


async function loadOrders(){

  const tbody =
    document.getElementById('orders');

  tbody.innerHTML =
    '<tr><td colspan="10">Loading orders...</td></tr>';


  const {data,error} =
    await sb
      .from('orders')
      .select('*,order_items(*)')
      .order('created_at',{
        ascending:false
      })
      .limit(500);


  if(error){

    tbody.innerHTML =
      `<tr>
        <td colspan="10">
          <div class="notice">
            ${escapeHtml(error.message)}
          </div>
        </td>
      </tr>`;

    return;

  }


  allOrders =
    data || [];


  updateStats();

  renderOrders();

}


function updateStats(){

  const orders =
    allOrders;


  const counts = {

    new:0,

    confirmed:0,

    preparing:0,

    out_for_delivery:0,

    delivered:0,

    cancelled:0

  };


  orders.forEach(order => {

    const status =
      order.order_status || 'new';

    counts[status] =
      (counts[status] || 0) + 1;

  });


  const paid =
    orders.filter(
      o => o.payment_status === 'paid'
    ).length;


  const revenue =
    orders
      .filter(
        o => o.payment_status === 'paid'
      )
      .reduce(
        (sum,o) =>
          sum + Number(o.total_amount || 0),
        0
      );


  document.getElementById('stats').innerHTML = `

    <div class="stat">

      <div class="muted">
        Total orders
      </div>

      <div class="money">
        ${orders.length}
      </div>

    </div>


    <div class="stat">

      <div class="muted">
        New orders
      </div>

      <div class="money">
        ${counts.new}
      </div>

    </div>


    <div class="stat">

      <div class="muted">
        Preparing
      </div>

      <div class="money">
        ${counts.preparing}
      </div>

    </div>


    <div class="stat">

      <div class="muted">
        Out for delivery
      </div>

      <div class="money">
        ${counts.out_for_delivery}
      </div>

    </div>


    <div class="stat">

      <div class="muted">
        Delivered
      </div>

      <div class="money">
        ${counts.delivered}
      </div>

    </div>


    <div class="stat">

      <div class="muted">
        Paid orders
      </div>

      <div class="money">
        ${paid}
      </div>

    </div>


    <div class="stat">

      <div class="muted">
        Paid revenue
      </div>

      <div class="money">
        ${naira(revenue)}
      </div>

    </div>

  `;

}


function renderOrders(){

  const tbody =
    document.getElementById('orders');

  const search =
    document
      .getElementById('search')
      .value
      .trim()
      .toLowerCase();


  const filter =
    document
      .getElementById('statusFilter')
      .value;


  const filtered =
    allOrders.filter(order => {

      const text = [

        order.order_number,

        order.customer_name,

        order.customer_phone,

        order.customer_email,

        order.delivery_address

      ]
      .join(' ')
      .toLowerCase();


      const matchesSearch =
        !search ||
        text.includes(search);


      const matchesStatus =
        filter === 'all' ||
        order.order_status === filter;


      return matchesSearch &&
             matchesStatus;

    });


  document.getElementById('orderCount')
    .textContent =
      `${filtered.length} order(s)`;


  if(!filtered.length){

    tbody.innerHTML =
      `<tr>
        <td colspan="10">
          No orders found.
        </td>
      </tr>`;

    return;

  }


  tbody.innerHTML =
    filtered.map(order => {

      const items =
        order.order_items || [];


      const itemHtml =
        items.map(item => `

          <div class="item">

            ${escapeHtml(
              item.product_name ||
              item.name ||
              'Product'
            )}

            ×

            ${Number(
              item.quantity || 0
            )}

            <span class="muted">

              (${naira(
                item.unit_price
              )})

            </span>

          </div>

        `).join('');


      const paid =
        order.payment_status === 'paid';


      const status =
        order.order_status || 'new';


      return `

        <tr>

          <td>

            <b>
              ${escapeHtml(
                order.order_number
              )}
            </b>

            <br>

            <span class="muted">
              ${escapeHtml(
                order.paystack_reference || ''
              )}
            </span>

          </td>


          <td>

            <b>
              ${escapeHtml(
                order.customer_name
              )}
            </b>

            <br>

            ${escapeHtml(
              order.customer_phone
            )}

            <br>

            <span class="muted">
              ${escapeHtml(
                order.customer_email
              )}
            </span>

            <br>

            <span class="muted">
              ${escapeHtml(
                order.delivery_address
              )}
            </span>

          </td>


          <td>

            <div class="order-items">

              ${itemHtml || 'No items'}

            </div>

          </td>


          <td>
            ${naira(order.subtotal)}
          </td>


          <td>
            ${naira(order.delivery_fee)}
          </td>


          <td>

            <b>
              ${naira(order.total_amount)}
            </b>

          </td>


          <td>

            <span class="${paid ? 'paid' : 'unpaid'}">

              ${escapeHtml(
                order.payment_status || 'unknown'
              )}

            </span>

            <br>

            <span class="muted">

              ${escapeHtml(
                order.payment_method || ''
              )}

            </span>

          </td>


          <td>

            <select
              onchange="setStatus(
                '${order.id}',
                this.value
              )">

              ${[
                'new',
                'confirmed',
                'preparing',
                'out_for_delivery',
                'delivered',
                'cancelled'
              ].map(s => `

                <option
                  value="${s}"
                  ${s === status ? 'selected' : ''}>

                  ${s.replaceAll('_',' ')}

                </option>

              `).join('')}

            </select>

          </td>


          <td>

            ${new Date(
              order.created_at
            ).toLocaleString()}

          </td>


          <td>

            <div class="row">

              <button
                onclick="viewOrder('${order.id}')">

                View

              </button>


              <button
                class="btn-secondary"
                onclick="whatsappOrder('${order.id}')">

                WhatsApp

              </button>

            </div>

          </td>

        </tr>

      `;

    }).join('');

}


function viewOrder(id){

  const order =
    allOrders.find(
      o => o.id === id
    );


  if(!order) return;


  const items =
    order.order_items || [];


  const itemRows =
    items.map(item => `

      <div class="detail-row">

        <div>
          <b>
            ${escapeHtml(
              item.product_name ||
              item.name ||
              'Product'
            )}
          </b>
        </div>

        <div class="muted">

          Quantity:
          ${Number(item.quantity || 0)}

          &nbsp; × &nbsp;

          ${naira(item.unit_price)}

        </div>

        <div>

          Item total:

          <b>
            ${naira(
              Number(item.quantity || 0) *
              Number(item.unit_price || 0)
            )}
          </b>

        </div>

      </div>

    `).join('');


  document.getElementById('modalContent')
    .innerHTML = `

      <div class="detail-row">

        <div class="detail-label">
          Order number
        </div>

        <div class="detail-value">
          <b>
            ${escapeHtml(
              order.order_number
            )}
          </b>
        </div>

      </div>


      <div class="detail-row">

        <div class="detail-label">
          Customer
        </div>

        <div class="detail-value">

          ${escapeHtml(
            order.customer_name
          )}

          <br>

          ${escapeHtml(
            order.customer_phone
          )}

          <br>

          ${escapeHtml(
            order.customer_email
          )}

        </div>

      </div>


      <div class="detail-row">

        <div class="detail-label">
          Delivery address
        </div>

        <div class="detail-value">

          ${escapeHtml(
            order.delivery_address
          )}

        </div>

      </div>


      <div class="detail-row">

        <div class="detail-label">
          Items ordered
        </div>

        ${itemRows}

      </div>


      <div class="detail-row">

        <div class="detail-label">
          Subtotal
        </div>

        <div class="detail-value">
          ${naira(order.subtotal)}
        </div>

      </div>


      <div class="detail-row">

        <div class="detail-label">
          Delivery fee
        </div>

        <div class="detail-value">
          ${naira(order.delivery_fee)}
        </div>

      </div>


      <div class="detail-row">

        <div class="detail-label">
          TOTAL PAID
        </div>

        <div class="detail-value">

          <b style="font-size:24px">
            ${naira(order.total_amount)}
          </b>

        </div>

      </div>


      <div class="detail-row">

        <div class="detail-label">
          Payment
        </div>

        <div class="detail-value">

          ${escapeHtml(
            order.payment_status || ''
          )}

          <br>

          Reference:

          ${escapeHtml(
            order.paystack_reference || ''
          )}

        </div>

      </div>


      <div class="detail-row">

        <div class="detail-label">
          Order status
        </div>

        <div class="detail-value">

          ${escapeHtml(
            order.order_status || 'new'
          )}

        </div>

      </div>


      <div class="detail-row">

        <div class="detail-label">
          Customer notes
        </div>

        <div class="detail-value">

          ${escapeHtml(
            order.customer_notes || 'None'
          )}

        </div>

      </div>

    `;


  document
    .getElementById('modal')
    .classList.remove('hidden');

}


function hideModal(){

  document
    .getElementById('modal')
    .classList.add('hidden');

}


function closeModal(event){

  if(event.target.id === 'modal'){

    hideModal();

  }

}


function whatsappOrder(id){

  const order =
    allOrders.find(
      o => o.id === id
    );


  if(!order) return;


  const items =
    order.order_items || [];


  const itemText =
    items.map(item =>
      `${item.product_name || item.name} × ${item.quantity} — ${naira(item.unit_price)}`
    ).join('\n');


  const message = [

    '*SweetBite Order*',

    `Order: ${order.order_number}`,

    '',

    '*Items:*',

    itemText,

    '',

    `Subtotal: ${naira(order.subtotal)}`,

    `Delivery: ${naira(order.delivery_fee)}`,

    `Total: ${naira(order.total_amount)}`,

    '',

    `Customer: ${order.customer_name}`,

    `Phone: ${order.customer_phone}`,

    `Address: ${order.delivery_address}`

  ].join('\n');


  const url =
    `https://wa.me/2349041130288?text=${
      encodeURIComponent(message)
    }`;


  window.open(
    url,
    '_blank'
  );

}


async function setStatus(id,status){

  const {error} =
    await sb
      .from('orders')
      .update({
        order_status:status
      })
      .eq('id',id);


  if(error){

    alert(error.message);

    return;

  }


  await loadOrders();

}


/* Check existing login */

(async()=>{

  const {data} =
    await sb.auth.getUser();

  if(data.user){

    showDash(data.user);

  }

})();

</script>

</body>
</html>
