<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bestbite Enterprise — Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>body{margin:0;background:#0b1117;color:#fff;font-family:Inter,Arial,sans-serif}.wrap{max-width:1250px;margin:auto;padding:28px}.card{background:#121c25;border:1px solid #263543;border-radius:16px;padding:20px;margin:14px 0}h1{margin:0;color:#ffc400}input,button,select{padding:11px;border-radius:9px;border:1px solid #3a4a58;background:#0b1117;color:#fff}button{background:#ffc400;color:#111;font-weight:800;cursor:pointer;border:0}.muted{color:#9aa9b5}.hidden{display:none}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.stat{background:#17232e;border-radius:14px;padding:18px}.money{font-size:24px;font-weight:900;margin-top:5px}table{width:100%;border-collapse:collapse}th,td{padding:11px;border-bottom:1px solid #263543;text-align:left;font-size:13px;vertical-align:top}.notice{background:#2b2410;border:1px solid #735e17;color:#ffe99a;padding:12px;border-radius:10px}@media(max-width:700px){.wrap{padding:15px}table{font-size:11px}}</style></head>
<body><div class="wrap"><div class="row" style="justify-content:space-between"><div><h1>BESTBITE ENTERPRISE</h1><div class="muted">Admin Dashboard</div></div><button id="logoutBtn" class="hidden" onclick="logout()">Logout</button></div>
<section id="login" class="card"><h2>Admin Login</h2><p class="muted">Use the Supabase Auth email and password you created for Bestbite.</p><div class="row"><input id="email" type="email" placeholder="Admin email"><input id="password" type="password" placeholder="Password"><button onclick="login()">Sign in</button></div><p id="err"></p></section>
<section id="dash" class="hidden"><div class="row"><button onclick="loadOrders()">Refresh orders</button><span id="who" class="muted"></span></div><div id="stats" class="grid"></div><div class="card"><h2>Orders</h2><div style="overflow:auto"><table><thead><tr><th>Order</th><th>Customer</th><th>Total</th><th>Payment</th><th>Status</th><th>Created</th><th>WhatsApp</th></tr></thead><tbody id="orders"></tbody></table></div></div></section></div>
<script>
const SUPABASE_URL='https://vilzncccdmegrwvrmadb.supabase.co';
const SUPABASE_KEY='sb_publishable_NZKF2zYb9l9LbrhulGD-8Q_FmqfD25V';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const naira=n=>`₦${Number(n||0).toLocaleString()}`;
function showDash(user){document.getElementById('login').classList.add('hidden');document.getElementById('dash').classList.remove('hidden');document.getElementById('logoutBtn').classList.remove('hidden');document.getElementById('who').textContent=user?.email||'';loadOrders()}
async function login(){err.textContent='';const {data,error}=await sb.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(error){err.textContent=error.message;return}showDash(data.user)}
async function logout(){await sb.auth.signOut();location.reload()}
async function loadOrders(){const {data,error}=await sb.from('orders').select('*,order_items(*)').order('created_at',{ascending:false}).limit(100);if(error){document.getElementById('orders').innerHTML=`<tr><td colspan=7>${error.message}</td></tr>`;return}const orders=data||[];const counts={new:0,confirmed:0,preparing:0,out_for_delivery:0,delivered:0,cancelled:0};orders.forEach(o=>counts[o.order_status]=(counts[o.order_status]||0)+1);document.getElementById('stats').innerHTML=`<div class=stat><div class=muted>Total orders</div><div class=money>${orders.length}</div></div><div class=stat><div class=muted>New</div><div class=money>${counts.new||0}</div></div><div class=stat><div class=muted>Preparing</div><div class=money>${counts.preparing||0}</div></div><div class=stat><div class=muted>Paid</div><div class=money>${orders.filter(o=>o.payment_status==='paid').length}</div></div>`;
document.getElementById('orders').innerHTML=orders.map(o=>{const items=(o.order_items||[]).map(i=>`${i.product_name} × ${i.quantity}`).join(', ');const msg=encodeURIComponent(['*Bestbite Enterprise Order*',`Order: ${o.order_number}`,'',items,'',`Total: ${naira(o.total_amount)}`,`Customer: ${o.customer_name}`,`Phone: ${o.customer_phone}`,`Address: ${o.delivery_address}`].join('\n'));return `<tr><td><b>${o.order_number}</b><br><span class=muted>${items}</span></td><td>${o.customer_name}<br>${o.customer_phone}<br><span class=muted>${o.delivery_address}</span></td><td><b>${naira(o.total_amount)}</b></td><td>${o.payment_status}<br><span class=muted>${o.payment_method}</span></td><td><select onchange="setStatus('${o.id}',this.value)">${['new','confirmed','preparing','out_for_delivery','delivered','cancelled'].map(s=>`<option value="${s}" ${s===o.order_status?'selected':''}>${s.replaceAll('_',' ')}</option>`).join('')}</select></td><td>${new Date(o.created_at).toLocaleString()}</td><td><a href="https://wa.me/2349041130288?text=${msg}" target="_blank"><button>WhatsApp</button></a></td></tr>`}).join('')||'<tr><td colspan=7>No orders yet.</td></tr>'}
async function setStatus(id,status){const {error}=await sb.from('orders').update({order_status:status}).eq('id',id);if(error)alert(error.message);else loadOrders()}
(async()=>{const {data}=await sb.auth.getUser();if(data.user)showDash(data.user)})();
</script></body></html>
