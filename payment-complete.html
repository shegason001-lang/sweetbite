<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Payment Complete | SweetBite</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
 
<header>
  <a class="logo" href="index.html">
    Sweet<span>Bite</span>
  </a> 

  <nav>
    <a href="index.html">Home</a>
    <a href="menu.html">Menu</a>
    <a href="categories.html">Categories</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
    <a href="support.html">Help & Support</a>
    <a href="orders.html">My Orders</a>
  </nav>

  <a class="cart" href="checkout.html">
    🛒 Cart <b id="cartCount">0</b>
  </a>
</header>


<main class="page">

  <div id="paymentResult" style="text-align:center;">
    <p class="eyebrow">PAYMENT</p>

    <h1>Checking your payment...</h1>

    <p>
      Please wait while we securely verify your Paystack payment.
    </p>
  </div>

</main>


<footer>
  <strong>SweetBite</strong>

  <span>
    Healthy snacks and pastries
  </span>

  <span>
    WhatsApp: 09041130288 • Call: 08029927866
  </span>

  <span>
    © 2026 SweetBite
  </span>
</footer>


<script src="app.js"></script>

<script>

async function verifyPayment() {

  const resultBox =
    document.getElementById("paymentResult");

  const params =
    new URLSearchParams(window.location.search);

  const reference =
    params.get("reference") ||
    params.get("trxref");

  if (!reference) {

    resultBox.innerHTML = `
      <p class="eyebrow">PAYMENT ERROR</p>

      <h1>Payment reference not found.</h1>

      <p>
        We could not find your Paystack payment reference.
      </p>

      <br>

      <a class="btn" href="checkout.html">
        Return to checkout
      </a>
    `;

    return;
  }


  /*
    Get the payment information that was saved
    before the customer went to Paystack.
  */
  let pendingPayment = null;

  try {
    pendingPayment =
      JSON.parse(
        localStorage.getItem("sweetbitePendingPayment") ||
        "null"
      );
  } catch (e) {
    pendingPayment = null;
  }


  try {

    const response =
      await fetch(
        "/api/paystack/verify/" +
        encodeURIComponent(reference)
      );

    const result =
      await response.json();


    if (!response.ok || !result.ok) {

      throw new Error(
        result.error ||
        "Payment could not be verified."
      );
    }


    const order =
      result.order;


    /*
      Get ordered items from the pending payment.
    */
    /*const orderedItems =
      Array.isArray(pendingPayment?.items)
        ? pendingPayment.items
        : [];   */

    const orderedItems =
  Array.isArray(order.order_items)
    ? order.order_items
    : Array.isArray(pendingPayment?.items)
      ? pendingPayment.items
      : [];

    /*
      Build item display.
    */
    let itemsHtml = "";

    if (orderedItems.length) {

      itemsHtml = orderedItems.map(item => {

        const name =
          item.name ||
          item.product_name ||
          "Product";

        const qty =
          Number(
            item.qty ??
            item.quantity ??
            1
          );

        const price =
          Number(
            item.price ??
            item.unit_price ??
            0
          );

        const lineTotal =
          price * qty;

        return `
          <div style="
            display:flex;
            justify-content:space-between;
            gap:20px;
            padding:12px 0;
            border-bottom:1px solid #eadfce;
            text-align:left;
          ">
            <div>
              <strong>${name}</strong>
              <div class="tiny">
                Quantity: ${qty}
              </div>
            </div>

            <strong>
              ₦${lineTotal.toLocaleString()}
            </strong>
          </div>
        `;

      }).join("");

    } else {

      itemsHtml = `
        <p class="tiny">
          Order items are available in your order record.
        </p>
      `;
    }


    /*
      Calculate delivery fee.
    */
    const total =
      Number(order.total_amount || 0);

    const itemSubtotal =
      orderedItems.reduce(
        (sum, item) => {

          const qty =
            Number(
              item.qty ??
              item.quantity ??
              1
            );

          const price =
            Number(
              item.price ??
              item.unit_price ??
              0
            );

          return sum + (price * qty);

        },
        0
      );

    const deliveryFee =
      Math.max(
        0,
        total - itemSubtotal
      );


    /*
      Save the successful order locally
      so it can appear on My Orders.
    */

    const existingOrders =
      JSON.parse(
        localStorage.getItem("sweetbiteOrders") ||
        "[]"
      );


    const orderMessage =
      `SWEETBITE PAID ORDER

Order: ${order.order_number}

Customer: ${order.customer_name}

Phone: ${order.customer_phone}

Address: ${order.delivery_address}

Items:
${orderedItems.map(item => {

  const name =
    item.name ||
    item.product_name ||
    "Product";

  const qty =
    Number(
      item.qty ??
      item.quantity ??
      1
    );

  return `- ${name} x ${qty}`;

}).join("\n")}

Payment: PAID

Total: ₦${total.toLocaleString()}`;


    const alreadySaved =
      existingOrders.some(
        x => x.id === order.order_number
      );


    if (!alreadySaved) {

      existingOrders.unshift({

        id: order.order_number,

        date:
          new Date().toLocaleString(),

        msg:
          orderMessage,

        total:
          total,

        items:
          orderedItems,

        delivery_fee:
          deliveryFee

      });

      localStorage.setItem(
        "sweetbiteOrders",
        JSON.stringify(existingOrders)
      );
    }


    /*
      Clear the cart only after
      successful payment verification.
    */

    localStorage.removeItem(
      "sweetbiteCart"
    );

    localStorage.removeItem(
      "sweetbitePendingPayment"
    );


    /*
      WhatsApp notification.
    */

    const whatsappItems =
      orderedItems.length
        ? orderedItems.map(item => {

            const name =
              item.name ||
              item.product_name ||
              "Product";

            const qty =
              Number(
                item.qty ??
                item.quantity ??
                1
              );

            return `- ${name} x ${qty}`;

          }).join("\n")
        : "Order items recorded in database.";


    const whatsappMessage =
      `SWEETBITE NEW PAID ORDER

Order: ${order.order_number}

Customer: ${order.customer_name}

Phone: ${order.customer_phone}

Address: ${order.delivery_address}

ITEMS:
${whatsappItems}

Payment: PAID

Total: ₦${total.toLocaleString()}

Please prepare the order.`;


    const whatsappUrl =
      "https://wa.me/2349041130288?text=" +
      encodeURIComponent(
        whatsappMessage
      );


    /*
      Successful confirmation page.
    */

    resultBox.innerHTML = `

      <p class="eyebrow">
        PAYMENT SUCCESSFUL
      </p>

      <h1>
        Thank you for your order! 🎉
      </h1>

      <p>
        Your payment has been successfully verified.
      </p>


      <div class="payment">

        <h2>Order confirmed</h2>

        <p>
          Order number:
          <strong>${order.order_number}</strong>
        </p>

        <p>
          Payment status:
          <strong>PAID</strong>
        </p>

        <hr>

        <h3 style="text-align:left;">
          Items ordered
        </h3>

        ${itemsHtml}

        <div style="
          display:flex;
          justify-content:space-between;
          padding-top:16px;
          text-align:left;
        ">
          <strong>Delivery</strong>

          <strong>
            ₦${deliveryFee.toLocaleString()}
          </strong>
        </div>

        <div style="
          display:flex;
          justify-content:space-between;
          padding-top:16px;
          margin-top:12px;
          border-top:2px solid #d8c5ae;
          text-align:left;
        ">
          <strong>Total paid</strong>

          <strong>
            ₦${total.toLocaleString()}
          </strong>
        </div>

      </div>


      <br>


      <a
        class="btn"
        href="${whatsappUrl}"
        target="_blank"
      >
        💬 Send Order to WhatsApp
      </a>


      <a
        class="btn secondary"
        href="orders.html"
      >
        My Orders
      </a>


      <a
        class="btn secondary"
        href="index.html"
      >
        Back to SweetBite
      </a>

    `;

  } catch (error) {

    console.error(
      "Payment verification error:",
      error
    );


    resultBox.innerHTML = `

      <p class="eyebrow">
        PAYMENT VERIFICATION
      </p>

      <h1>
        We could not verify the payment.
      </h1>

      <p>
        Your payment has not been marked as a completed
        SweetBite order yet.
      </p>

      <p class="tiny">
        Please do not pay again immediately.
        Contact SweetBite if your account was charged.
      </p>

      <br>

      <a
        class="btn"
        href="checkout.html"
      >
        Return to checkout
      </a>

    `;
  }
}


verifyPayment();

</script>

</body>
</html>
